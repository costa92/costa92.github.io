<text x="180.0" y="424.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">Delete 连目录删；</text>
<text x="180.0" y="440.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">Retain 留给你收尾</text>
