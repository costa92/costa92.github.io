<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="title desc">
<title id="title">OrderedReady 下的强制回滚</title>
<desc id="desc">回滚模板后，还要手工删掉已用坏配置跑起来的 Pod。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="490" rx="16" fill="#0f172a"/>
<rect width="360" height="490" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">OrderedReady 下的强制回滚</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">坏更新卡住，回滚也解不开</text>
<rect x="32" y="86" width="296" height="74" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="180.0" y="116.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">坏模板</text>
<text x="180.0" y="137.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">web-2 不 Ready，更新停住</text>
<rect x="32" y="198" width="296" height="74" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="180.0" y="228.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">rollout undo</text>
<text x="180.0" y="249.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">updateRevision 回到旧版</text>
<path d="M180 160 V190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="310" width="296" height="74" rx="11" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/>
<text x="180.0" y="340.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">删除 web-2</text>
<text x="180.0" y="361.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">按旧模板重建后 Ready</text>
<path d="M180 272 V302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="439.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">回滚模板后，还要手工删掉已用坏配置跑起来的 Pod。</text>
<line x1="24" y1="457" x2="336" y2="457" stroke="#334155"/>
<text x="24" y="476" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text>
</svg>
