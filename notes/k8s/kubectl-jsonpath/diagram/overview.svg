<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">kubectl JSONPath 查询</title><desc id="diagram-desc">jsonpath 适合取字段和简单过滤；要判断缺字段、正则或与或，换 go-template 或 jq。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="515" rx="16" fill="#0f172a"/><rect width="360" height="515" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">kubectl JSONPath 查询</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">按需求选输出方式</text>
<rect x="40" y="84" width="296" height="58" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="188.0" y="109.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">按需求选输出方式</text>
<text x="188.0" y="125.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">依条件分别判断</text>
<path d="M40 114 H24 V441" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
<path d="M24 194 H32" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="164" width="296" height="62" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="188.0" y="191.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">jsonpath</text>
<text x="188.0" y="207.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">取字段、按 type 挑项、等值过滤</text>
<path d="M24 270 H32" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
