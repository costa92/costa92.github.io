<text x="188.0" y="267.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">custom-columns</text>
<text x="188.0" y="283.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">给人看的表格，缺值显示 &lt;none&gt;</text>
<path d="M24 346 H32" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
