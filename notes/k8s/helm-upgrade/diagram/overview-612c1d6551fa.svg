<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Helm 升级验证与回滚</title><desc id="diagram-desc">--wait 成功只说明资源就绪；用 helm test 检查真实响应，回滚前先看清目标修订的 values 和清单。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="500" rx="16" fill="#0f172a"/><rect width="360" height="500" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Helm 升级验证与回滚</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">Helm 成功不等于改动生效</text>
<rect x="24" y="80" width="312" height="62" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="107.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">upgrade --wait</text>
<text x="180.0" y="123.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">只等资源就绪，就绪由探针决定</text>
<path d="M180 142 V184 H98 V222" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 184 H262 V222" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="222" width="148" height="94" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="257.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">成功</text>
<text x="98.0" y="273.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">helm test</text>
<text x="98.0" y="289.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">查真实响应</text>
<rect x="188" y="222" width="148" height="94" rx="10" fill="#152338" stroke="#fb7185" stroke-width="1.4"/>
<text x="262.0" y="257.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">失败</text>
<text x="262.0" y="273.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">共享的 ConfigMap</text>
<text x="262.0" y="289.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">可能已坏</text>
<path d="M262 316 V370" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="188" y="370" width="148" height="72" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="262.0" y="394.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">rollback</text>
<text x="262.0" y="410.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">恢复全部</text>
<text x="262.0" y="426.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">values，Job 重跑</text>
<line x1="24" y1="465" x2="336" y2="465" stroke="#334155"/>
<text x="24" y="485" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
