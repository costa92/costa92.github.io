<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" role="img" aria-labelledby="title desc">
<title id="title">hostPort 与 maxSurge 互相等待</title>
<desc id="desc">没有 Pod 崩溃，更新却不前进；改回 maxSurge: 0。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="485" rx="16" fill="#0f172a"/>
<rect width="360" height="485" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">hostPort 与 maxSurge 互相等待</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">故障二：hostPort 遇上 maxSurge</text>
<rect x="28" y="82" width="284" height="70" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="170.0" y="110.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">surge Pod</text>
<text x="170.0" y="131.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">要和旧 Pod 同节点共存</text>
<rect x="28" y="188" width="284" height="70" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="170.0" y="216.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">hostPort 被占</text>
<text x="170.0" y="237.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">调度器放不下，Pending</text>
<path d="M170 152 V180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="294" width="284" height="70" rx="11" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/>
<text x="170.0" y="322.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">旧 Pod</text>
<text x="170.0" y="343.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">等新 Pod 就绪才删除</text>
<path d="M170 258 V286" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M312 364 H338 V117 H312" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="180" y="434.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">没有 Pod 崩溃，更新却不前进；改回 maxSurge: 0。</text>
<line x1="24" y1="452" x2="336" y2="452" stroke="#334155"/>
<text x="24" y="471" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text>
