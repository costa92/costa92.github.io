<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" role="img" aria-labelledby="title desc">
<title id="title">一次限时练习的闭环</title>
<desc id="desc">复盘命令与错误原因，再重新练习。</desc>
