<text x="170.0" y="322.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">限时排障</text>
<text x="170.0" y="343.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">用证据缩小范围</text>
<path d="M170 258 V286" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
