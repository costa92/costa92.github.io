<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">练习：从部署到故障定位</text>
<rect x="28" y="82" width="284" height="70" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
