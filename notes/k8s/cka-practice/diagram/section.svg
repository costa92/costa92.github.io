<text x="170.0" y="237.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">记录状态与事件</text>
<path d="M170 152 V180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
