<line x1="151" y1="107" x2="151" y2="167" stroke="#334155"/>
<text x="243" y="133.8" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">题 2：targetPort 8080</text>
<text x="243" y="148.2" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">无进程监听</text>
<rect x="25" y="195" width="310" height="90" rx="11" fill="#142238" stroke="#334155"/>
<rect x="25" y="195" width="5" height="90" rx="2" fill="#34d399"/>
<text x="91" y="245.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">连接超时</text>
<line x1="151" y1="210" x2="151" y2="270" stroke="#334155"/>
<text x="243" y="244.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">被 NetworkPolicy 拦截</text>
<rect x="25" y="298" width="310" height="90" rx="11" fill="#142238" stroke="#334155"/>
<rect x="25" y="298" width="5" height="90" rx="2" fill="#a78bfa"/>
<text x="91" y="348.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">解析超时</text>
