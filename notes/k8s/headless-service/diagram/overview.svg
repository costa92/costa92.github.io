<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 522" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Headless Service 与 Pod DNS</title><desc id="diagram-desc">Headless Service 不分配虚拟 IP，DNS 直接返回就绪 Pod 的地址，连谁由客户端决定；CoreDNS 缓存会让地址变化滞后。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="522" rx="16" fill="#0f172a"/><rect width="360" height="522" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Headless Service 与 Pod DNS</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">DNS 直接返回后端记录</text>
<rect x="24" y="84" width="312" height="58" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="109.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Headless Service</text>
<text x="180.0" y="125.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">clusterIP: None，无虚拟 IP</text>
<path d="M180 142 V174 H98 V216" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="216" width="148" height="106" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="265.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">A 记录</text>
<text x="98.0" y="281.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">一组就绪 Pod IP</text>
<path d="M98 322 V370 H180 V396" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 142 V174 H262 V216" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="188" y="216" width="148" height="106" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="257.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">SRV 记录</text>
<text x="262.0" y="273.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">Pod 端口与</text>
<text x="262.0" y="289.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">Pod 域名</text>
<path d="M262 322 V370 H180 V396" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="180" cy="174" r="5" fill="#fbbf24"/>
<rect x="24" y="396" width="312" height="76" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="430.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">客户端</text>
<text x="180.0" y="446.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">自选地址；旧地址可能还在缓存里</text>
<line x1="24" y1="487" x2="336" y2="487" stroke="#334155"/>
<text x="24" y="507" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
