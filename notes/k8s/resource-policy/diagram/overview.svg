<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 505" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">LimitRange 与 ResourceQuota</title><desc id="diagram-desc">LimitRanger 先补默认值，ResourceQuota 再按补完后的值计总量；两者都只在准入时检查，已有 Pod 不受影响。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="505" rx="16" fill="#0f172a"/><rect width="360" height="505" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">LimitRange 与 ResourceQuota</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">先补默认值，再算配额</text>
<rect x="24" y="76" width="312" height="60" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="102.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">创建资源请求</text>
<text x="180.0" y="118.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">进入 API 准入检查</text>
<path d="M180 136 V176" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="176" width="312" height="64" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="180.0" y="204.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">① LimitRange</text>
<text x="180.0" y="220.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">补默认值，并校验上下限与比例</text>
<path d="M180 240 V280" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="280" width="312" height="64" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="180.0" y="308.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">② ResourceQuota</text>
<text x="180.0" y="324.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">按补全后的值累计总量</text>
<path d="M180 344 V384" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="384" width="312" height="68" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="406.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">任一拒绝 → 创建失败</text>
<text x="180.0" y="422.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">只在准入时检查，</text>
<text x="180.0" y="438.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">已有 Pod 不受影响</text>
<line x1="24" y1="470" x2="336" y2="470" stroke="#334155"/>
<text x="24" y="490" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
