<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Ingress 的请求路径</title><desc id="diagram-desc">只有 Ingress 对象还不能转发流量，集群中还需要实际运行的控制器。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="490" rx="16" fill="#0f172a"/><rect width="360" height="490" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Ingress 的请求路径</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">规则需要控制器执行</text>
<rect x="24" y="82" width="148" height="90" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="98.0" y="123.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">浏览器</text>
<text x="98.0" y="139.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">HTTP(S) 请求</text>
<rect x="188" y="82" width="148" height="90" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="123.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Ingress 规则</text>
<text x="262.0" y="139.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">声明主机与路径</text>
<path d="M98 172 V210 H180 V242" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M262 172 V210 H180 V242" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="24" y="242" width="312" height="66" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="180.0" y="271.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Ingress Controller</text>
<text x="180.0" y="287.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">读取规则并接收请求</text>
<path d="M180 308 V364" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="364" width="312" height="66" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="393.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Service → Pod</text>
<text x="180.0" y="409.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">转发至就绪后端</text>
<line x1="24" y1="455" x2="336" y2="455" stroke="#334155"/>
<text x="24" y="475" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
