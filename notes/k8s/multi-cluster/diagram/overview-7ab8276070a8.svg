<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 522" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">context 解析出的目标</title><desc id="diagram-desc">context 名字能改、同名条目会被顶替；写入前核对解析出的 server 地址和 API Server 认定的身份。</desc>
