<path d="M180 150 V180 H98 V216" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 180 H262 V216" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="216" width="148" height="104" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
