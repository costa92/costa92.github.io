<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 518" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Pod 优雅终止与流量排空</title><desc id="diagram-desc">用带 preStop 与 TERM 处理的实验 Pod 观察删除宽限期，并区分进程退出与 Service 流量排空。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="518" rx="16" fill="#0f172a"/><rect width="360" height="518" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Pod 优雅终止与流量排空</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">终止与流量排空</text>
<rect x="24" y="78" width="312" height="62" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="105.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">删除请求</text>
<text x="180.0" y="121.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">进入 Terminating</text>
<path d="M180 140 V178 H98 V214" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 178 H262 V214" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="214" width="148" height="94" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="257.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">服务发现</text>
<text x="98.0" y="273.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">移出后端有传播延迟</text>
<rect x="188" y="214" width="148" height="94" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="257.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">kubelet</text>
<text x="262.0" y="273.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">preStop / SIGTERM</text>
<path d="M262 308 V342 H98 V378" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M262 342 V378" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="378" width="148" height="82" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="415.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">正常退出</text>
<text x="98.0" y="431.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">宽限期内完成</text>
<rect x="188" y="378" width="148" height="82" rx="10" fill="#152338" stroke="#fb7185" stroke-width="1.4"/>
