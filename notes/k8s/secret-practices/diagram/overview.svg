<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Secret 的安全使用边界</title><desc id="diagram-desc">有 list 权限或能在 namespace 创建 Pod 的主体都能读到 Secret；Pod 内按容器挂载有效，shareProcessNamespace 会打穿它。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="515" rx="16" fill="#0f172a"/><rect width="360" height="515" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Secret 的安全使用边界</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">读取路径与 Pod 内隔离</text>
<rect x="24" y="82" width="312" height="60" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="108.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Secret</text>
<text x="180.0" y="124.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">get 之外还有别的读取路径</text>
<path d="M180 142 V179 H98 V216" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 179 H262 V216" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="216" width="148" height="104" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="264.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">list secrets</text>
<text x="98.0" y="280.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">返回完整对象和值</text>
<rect x="188" y="216" width="148" height="104" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="256.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">create pods</text>
<text x="262.0" y="272.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">挂进自己的</text>
<text x="262.0" y="288.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">Pod 再读</text>
<rect x="24" y="383" width="312" height="75" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="416.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Pod 内部</text>
<text x="180.0" y="432.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">按容器挂载；共享 PID 会打穿</text>
<line x1="24" y1="480" x2="336" y2="480" stroke="#334155"/>
<text x="24" y="500" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
