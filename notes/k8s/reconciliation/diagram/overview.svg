<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 535" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">控制器的调谐循环</title><desc id="diagram-desc">调谐不是单次执行；控制器会持续观察并重试，直到实际状态接近期望。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="535" rx="16" fill="#0f172a"/><rect width="360" height="535" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">控制器的调谐循环</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">观察、比较、执行、再观察</text>
<rect x="32" y="82" width="280" height="68" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="172.0" y="112.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">读取期望 spec</text>
<text x="172.0" y="128.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">用户声明目标</text>
<rect x="32" y="190" width="280" height="68" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="172.0" y="220.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">观察实际状态</text>
<text x="172.0" y="236.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">读取对象与依赖</text>
<path d="M172 150 V182" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="298" width="280" height="68" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="172.0" y="328.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">计算差异</text>
<text x="172.0" y="344.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">决定下一次动作</text>
<path d="M172 258 V290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32" y="406" width="280" height="68" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="172.0" y="428.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">执行 / 更新 status</text>
<text x="172.0" y="444.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">失败重试；配</text>
<text x="172.0" y="460.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">置错误待修改</text>
<path d="M172 366 V398" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M312 474 H338 V116 H312" fill="none" stroke="#fb923c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="24" y1="500" x2="336" y2="500" stroke="#334155"/>
<text x="24" y="520" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
