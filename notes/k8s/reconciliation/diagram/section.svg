<rect width="360" height="490" rx="16" fill="#0f172a"/>
<rect width="360" height="490" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">删除受管理 Pod 后</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">建立独立实验</text>
<rect x="32" y="86" width="296" height="74" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
