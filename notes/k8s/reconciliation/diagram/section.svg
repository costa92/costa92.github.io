<text x="180.0" y="249.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">ReplicaSet 仍有期望副本数</text>
