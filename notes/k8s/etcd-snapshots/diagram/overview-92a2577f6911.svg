<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 501" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">etcd 快照与恢复检查清单</title><desc id="diagram-desc">etcd 快照不能代替应用数据备份；status 能读出不代表文件没坏，只有 restore 会校验内嵌哈希。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="501" rx="16" fill="#0f172a"/><rect width="360" height="501" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">etcd 快照与恢复检查清单</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">status 通过不等于快照可用</text>
<rect x="24" y="70" width="312" height="56" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="94.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">snapshot save</text>
<text x="180.0" y="110.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">加 --command-timeout，查 .part</text>
<path d="M180 126 V172" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="172" width="312" height="56" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="180.0" y="196.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">记录 sha256sum 与 status</text>
<text x="180.0" y="212.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">status 能读出不代表文件没坏</text>
<path d="M180 228 V268 H98 V308" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 268 H262 V308" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="308" width="148" height="112" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="98.0" y="360.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">定期演练</text>
<text x="98.0" y="376.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">restore 到临时目录</text>
<rect x="188" y="308" width="148" height="112" rx="10" fill="#152338" stroke="#fb7185" stroke-width="1.4"/>
<text x="262.0" y="352.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">生产恢复</text>
<text x="262.0" y="368.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">停 API Server</text>
<text x="262.0" y="384.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">再切换数据目录</text>
<text x="180" y="450" text-anchor="middle" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">只有 restore 会校验快照内嵌的哈希</text>
<line x1="24" y1="466" x2="336" y2="466" stroke="#334155"/>
<text x="24" y="486" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
