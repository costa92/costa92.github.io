<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 501" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">etcd 快照与恢复检查清单</title><desc id="diagram-desc">为自管 Kubernetes 集群确定 etcd 快照的拓扑、凭据、校验与隔离恢复步骤，避免把快照文件误认为已验证的备份。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="501" rx="16" fill="#0f172a"/><rect width="360" height="501" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">etcd 快照与恢复检查清单</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">备份与恢复是两条路径</text>
<rect x="24" y="70" width="312" height="56" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="94.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">etcd 快照</text>
<text x="180.0" y="110.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">按拓扑与端点安全保存</text>
<path d="M180 126 V172" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="172" width="312" height="56" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="180.0" y="196.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">核验快照</text>
<text x="180.0" y="212.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">检查文件与成员健康</text>
<path d="M180 228 V268 H98 V308" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 268 H262 V308" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="308" width="148" height="112" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="98.0" y="360.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">常规演练</text>
<text x="98.0" y="376.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">隔离环境恢复验证</text>
<rect x="188" y="308" width="148" height="112" rx="10" fill="#152338" stroke="#fb7185" stroke-width="1.4"/>
<text x="262.0" y="360.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">生产故障</text>
<text x="262.0" y="376.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">确认恢复决策后执行</text>
<text x="180" y="450" text-anchor="middle" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">演练与生产恢复是不同路径</text>
<line x1="24" y1="466" x2="336" y2="466" stroke="#334155"/>
<text x="24" y="486" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
