<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Service 如何找到 Pod</title><desc id="diagram-desc">Pod 地址会变化；Service 借助后端发现机制维持稳定入口。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="520" rx="16" fill="#0f172a"/><rect width="360" height="520" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Service 如何找到 Pod</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">稳定入口与动态后端</text>
<rect x="24" y="76" width="312" height="62" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="103.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">客户端</text>
<text x="180.0" y="119.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">访问稳定的 Service 名称或地址</text>
<path d="M180 138 V184 H98 V218" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="218" width="148" height="98" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="263.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Service</text>
<text x="98.0" y="279.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">稳定虚拟入口</text>
<rect x="188" y="218" width="148" height="98" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="263.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">EndpointSlice</text>
<text x="262.0" y="279.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">记录就绪后端</text>
<path d="M188 269 H172" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M98 316 V358 H180 V392" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="392" width="312" height="70" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="423.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">就绪 Pod</text>
<text x="180.0" y="439.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">由服务数据路径选择后端</text>
<line x1="24" y1="485" x2="336" y2="485" stroke="#334155"/>
<text x="24" y="505" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
