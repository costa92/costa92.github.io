<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 539" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">HPA 不扩容排查</title><desc id="diagram-desc">先看 describe hpa 里哪条 Condition 为 False；HPA 显示已扩容时，再对比 Deployment 的 READY。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="539" rx="16" fill="#0f172a"/><rect width="360" height="539" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">HPA 不扩容排查</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">先看 describe hpa 的 Conditions</text>
<rect x="40" y="78" width="296" height="58" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="188.0" y="103.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">kubectl describe hpa</text>
<text x="188.0" y="119.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">看 Conditions 里哪一行是 False</text>
<path d="M40 108 H24 V352" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
<path d="M24 188 H40" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="158" width="296" height="64" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="188.0" y="186.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">AbleToScale=False</text>
<text x="188.0" y="202.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">核对 scaleTargetRef 三个字段</text>
<path d="M24 268 H40" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="238" width="296" height="64" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="188.0" y="266.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">ScalingActive=False</text>
<text x="188.0" y="282.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">缺 request、目标为 0 或刚发布</text>
<path d="M24 348 H40" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="318" width="296" height="64" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="188.0" y="346.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">三条都正常</text>
<text x="188.0" y="362.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">容忍度、稳定窗口或 maxReplicas</text>
<path d="M40 403 H336" fill="none" stroke="#334155"/>
<rect x="40" y="423" width="296" height="60" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="188.0" y="441.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">排查后统一验证</text>
<text x="188.0" y="457.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">对比 HPA REPLICAS</text>
<text x="188.0" y="473.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">与 Deployment READY</text>
<line x1="24" y1="504" x2="336" y2="504" stroke="#334155"/>
<text x="24" y="524" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
