<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="title desc">
<title id="title">三种预览离集群多远</title>
<desc id="desc">三种预览都不会让 API Server 校验对象。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="490" rx="16" fill="#0f172a"/>
<rect width="360" height="490" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">三种预览离集群多远</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">预览：template、dry-run=client、dry-run=server</text>
<rect x="25" y="92" width="310" height="90" rx="11" fill="#142238" stroke="#334155"/>
<rect x="25" y="92" width="5" height="90" rx="2" fill="#22d3ee"/>
<text x="91" y="133.6" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">helm</text>
<text x="91" y="150.4" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">template</text>
<line x1="151" y1="107" x2="151" y2="167" stroke="#334155"/>
<text x="243" y="141.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">不连集群，版本取默认值</text>
<rect x="25" y="195" width="310" height="90" rx="11" fill="#142238" stroke="#334155"/>
<rect x="25" y="195" width="5" height="90" rx="2" fill="#34d399"/>
<text x="91" y="236.6" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">dry-run=</text>
<text x="91" y="253.4" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">client</text>
<line x1="151" y1="210" x2="151" y2="270" stroke="#334155"/>
<text x="243" y="244.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">读到集群版本，lookup 为空</text>
<rect x="25" y="298" width="310" height="90" rx="11" fill="#142238" stroke="#334155"/>
<rect x="25" y="298" width="5" height="90" rx="2" fill="#a78bfa"/>
<text x="91" y="339.6" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">dry-run=</text>
<text x="91" y="356.4" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f8fafc">server</text>
<line x1="151" y1="313" x2="151" y2="373" stroke="#334155"/>
<text x="243" y="347.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">lookup 能查到现有对象</text>
<text x="180" y="439.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">三种预览都不会让 API Server 校验对象。</text>
<line x1="24" y1="457" x2="336" y2="457" stroke="#334155"/>
<text x="24" y="476" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text>
