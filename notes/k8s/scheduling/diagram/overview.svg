<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Pod 调度与节点选择</title><desc id="diagram-desc">通过节点标签和 nodeSelector 观察调度结果，区分亲和性、污点容忍与直接指定节点。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="480" rx="16" fill="#0f172a"/><rect width="360" height="480" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Pod 调度与节点选择</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">无可行节点就保持 Pending</text>
<rect x="24" y="82" width="312" height="60" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="108.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">待调度 Pod</text>
<text x="180.0" y="124.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">资源请求与硬性约束</text>
<path d="M180 142 V194" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="194" width="312" height="60" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="180.0" y="220.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">过滤节点</text>
<text x="180.0" y="236.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">保留满足全部硬约束的候选</text>
<path d="M180 254 V288 H98 V326" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 288 H262 V326" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="326" width="148" height="92" rx="10" fill="#152338" stroke="#fb7185" stroke-width="1.4"/>
<text x="98.0" y="368.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">无候选</text>
<text x="98.0" y="384.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">保持 Pending</text>
<rect x="188" y="326" width="148" height="92" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="368.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">有候选</text>
<text x="262.0" y="384.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">评分并绑定节点</text>
<line x1="24" y1="445" x2="336" y2="445" stroke="#334155"/>
<text x="24" y="465" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
