<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Pod 网络路径与 CNI 排查</title><desc id="diagram-desc">按 Pod IP、Service 端点和 DNS 三层定位通信故障，并识别 CNI 与 Service 实现各自负责的部分。</desc>
