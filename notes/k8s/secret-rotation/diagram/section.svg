<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
<title id="title">热加载该监听哪里</title>
<desc id="desc">两种都收不到 c（内容修改）事件，热加载要盯 ..data 的切换。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="430" rx="16" fill="#0f172a"/>
<rect width="360" height="430" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">热加载该监听哪里</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">文件是怎么换掉的：监听要放在目录上</text>
<rect x="24" y="133" width="148" height="175" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="98.0" y="197.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">只监听文件</text>
<text x="98.0" y="220.1" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">收到 D、x 后失效</text>
<text x="98.0" y="234.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">有 subPath 时</text>
<text x="98.0" y="248.9" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">一个事件都没有</text>
<rect x="188" y="133" width="148" height="175" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="262.0" y="205.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">监听目录</text>
<text x="262.0" y="227.3" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">看到 ..data_tmp</text>
<text x="262.0" y="241.7" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">rename 成 ..data</text>
<text x="180" y="341" text-anchor="middle" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12">两者对照着看</text>
<text x="180" y="379.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">两种都收不到 c（内容修改）事件，热加载要盯 ..data 的切换。</text>
<line x1="24" y1="397" x2="336" y2="397" stroke="#334155"/>
<text x="24" y="416" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text>
</svg>
