<text x="172.0" y="128.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">CPU / 自定义指标</text>
<rect x="32" y="190" width="280" height="68" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="172.0" y="220.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">HPA 计算</text>
<text x="172.0" y="236.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">按目标值估算副本</text>
