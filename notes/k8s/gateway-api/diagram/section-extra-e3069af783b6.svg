<text x="262.0" y="341.2" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">ResolvedRefs</text>
<text x="180" y="424.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">Gateway 和 HTTPRoute 条件都通过后再测真实流量。</text>
