<text x="98.0" y="227.3" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">未就绪 Pod 不进 DNS</text>
<text x="98.0" y="241.7" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">全未就绪则 NXDOMAIN</text>
<rect x="188" y="133" width="148" height="175" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="262.0" y="204.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">publishNotReady</text>
<text x="262.0" y="222.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Addresses</text>
