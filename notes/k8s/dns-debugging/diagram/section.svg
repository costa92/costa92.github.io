<text x="180" y="341" text-anchor="middle" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12">两者对照着看</text>
<text x="180" y="379.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">headless 报 NXDOMAIN，先查 Service 和就绪地址。</text>
