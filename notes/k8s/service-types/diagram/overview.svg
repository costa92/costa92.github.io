<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">NodePort 流量进节点之后</title><desc id="diagram-desc">externalTrafficPolicy: Cluster 时任何节点都能转发，但后端看到的是节点 IP；Local 保留客户端 IP，没有本地后端的节点直接 DROP，要靠 LoadBalancer 的健康检查端口避开。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="515" rx="16" fill="#0f172a"/><rect width="360" height="515" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">NodePort 流量进节点之后</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">externalTrafficPolicy 两种取值</text>
<rect x="24" y="82" width="312" height="60" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="108.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">NodePort 请求</text>
<text x="180.0" y="124.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">打到任意节点的 nodePort</text>
<path d="M180 142 V179 H98 V216" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 179 H262 V216" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="216" width="148" height="104" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="256.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Cluster（默认）</text>
<text x="98.0" y="272.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">任何节点可转发；</text>
<text x="98.0" y="288.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">源 IP 变成节点 IP</text>
<rect x="188" y="216" width="148" height="104" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="256.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Local</text>
<text x="262.0" y="272.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">保留客户端 IP；</text>
<text x="262.0" y="288.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">无后端节点 DROP</text>
<rect x="24" y="383" width="312" height="75" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="408.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">LoadBalancer + Local</text>
<text x="180.0" y="424.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">健康检查端口 503，</text>
<text x="180.0" y="440.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">LB 避开该节点</text>
<line x1="24" y1="480" x2="336" y2="480" stroke="#334155"/>
<text x="24" y="500" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
