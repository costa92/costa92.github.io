<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 475" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Pod 生命周期与初始化容器</title><desc id="diagram-desc">通过初始化容器、共享卷和删除时的宽限期，观察 Pod 从创建到终止的关键步骤。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="475" rx="16" fill="#0f172a"/><rect width="360" height="475" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">Pod 生命周期与初始化容器</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">启动与终止是不同阶段</text>
<rect x="24" y="80" width="312" height="60" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="106.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">init 容器</text>
<text x="180.0" y="122.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">按顺序执行</text>
<path d="M180 140 V174 H98 V208" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 174 H262 V208" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="208" width="148" height="88" rx="10" fill="#152338" stroke="#fb7185" stroke-width="1.4"/>
<text x="98.0" y="248.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">失败</text>
<text x="98.0" y="264.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">按重启策略重试</text>
<rect x="188" y="208" width="148" height="88" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="262.0" y="248.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">成功</text>
<text x="262.0" y="264.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">启动应用容器</text>
<path d="M262 296 V350" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="350" width="312" height="64" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="378.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">终止宽限期</text>
<text x="180.0" y="394.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">退出；超时则强制终止</text>
<line x1="24" y1="440" x2="336" y2="440" stroke="#334155"/>
<text x="24" y="460" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
