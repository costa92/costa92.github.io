<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 522" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">容器镜像与本地构建</title><desc id="diagram-desc">宿主机构建的镜像要导入节点或经仓库分发；Pod 创建时按标签确定 imagePullPolicy，之后不变。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="522" rx="16" fill="#0f172a"/><rect width="360" height="522" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">容器镜像与本地构建</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">镜像进入节点的两条路径</text>
<rect x="24" y="84" width="312" height="58" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="109.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">docker build</text>
<text x="180.0" y="125.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">镜像只在宿主机 Docker 里</text>
<path d="M180 142 V174 H98 V216" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="216" width="148" height="106" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="98.0" y="257.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">kind load 导入</text>
<text x="98.0" y="273.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">按标签引用，</text>
<text x="98.0" y="289.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">可只导部分节点</text>
<path d="M98 322 V370 H180 V396" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 142 V174 H262 V216" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="188" y="216" width="148" height="106" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="262.0" y="257.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">推送镜像仓库</text>
<text x="262.0" y="273.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">节点拉取，</text>
<text x="262.0" y="289.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">可按摘要引用</text>
<path d="M262 322 V370 H180 V396" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="180" cy="174" r="5" fill="#fbbf24"/>
<rect x="24" y="396" width="312" height="76" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="430.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Pod 创建时定策略</text>
<text x="180.0" y="446.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">latest 默认 Always，会去仓库拉</text>
<line x1="24" y1="487" x2="336" y2="487" stroke="#334155"/>
<text x="24" y="507" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
