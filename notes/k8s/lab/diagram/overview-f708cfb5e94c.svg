<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">从配置文件到可用集群</title><desc id="diagram-desc">kind 用一份配置建出三节点集群；命令返回时节点还没 Ready，要等节点和 default ServiceAccount 就绪再用。</desc>
