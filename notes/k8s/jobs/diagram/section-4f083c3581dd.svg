<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 585" role="img" aria-labelledby="title desc">
<title id="title">CronJob 一次触发之后</title>
<desc id="desc">不要把定时触发和任务成功混为一谈。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="585" rx="16" fill="#0f172a"/>
<rect width="360" height="585" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">CronJob 一次触发之后</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">定时执行</text>
<rect x="32" y="86" width="296" height="74" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="180.0" y="116.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">CronJob</text>
<text x="180.0" y="137.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">按 schedule 创建 Job</text>
<rect x="32" y="198" width="296" height="74" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="180.0" y="228.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Job</text>
<text x="180.0" y="249.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">管理完成目标</text>
<path d="M180 160 V190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="310" width="296" height="74" rx="11" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/>
<text x="180.0" y="340.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Pod</text>
<text x="180.0" y="361.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">运行任务容器</text>
<path d="M180 272 V302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="422" width="296" height="74" rx="11" fill="#142238" stroke="#fbbf24" stroke-width="1.5"/>
<text x="180.0" y="452.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">状态</text>
<text x="180.0" y="473.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">完成或按策略重试</text>
<path d="M180 384 V414" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="534.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">不要把定时触发和任务成功混为一谈。</text>
