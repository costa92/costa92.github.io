<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="title desc">
<title id="title">同一个标签如何形成后端</title>
<desc id="desc">标签不匹配时 Service 可能没有后端。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="490" rx="16" fill="#0f172a"/>
<rect width="360" height="490" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">同一个标签如何形成后端</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">检查匹配链</text>
<rect x="32" y="86" width="296" height="74" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="180.0" y="116.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Pod labels</text>
<text x="180.0" y="137.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">app=demo-web</text>
<rect x="32" y="198" width="296" height="74" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="180.0" y="228.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Service selector</text>
<text x="180.0" y="249.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">匹配 app=demo-web</text>
<path d="M180 160 V190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="310" width="296" height="74" rx="11" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/>
<text x="180.0" y="340.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">EndpointSlice</text>
<text x="180.0" y="361.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">记录符合条件的后端</text>
<path d="M180 272 V302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="439.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">标签不匹配时 Service 可能没有后端。</text>
