<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 585" role="img" aria-labelledby="title desc">
<title id="title">改标签隔离 Pod 的全过程</title>
<desc id="desc">改回标签会删掉一个健康 Pod，调试完直接删隔离的 Pod。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="585" rx="16" fill="#0f172a"/>
<rect width="360" height="585" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">改标签隔离 Pod 的全过程</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">改标签把 Pod 移出 Deployment</text>
<line x1="48" y1="106" x2="48" y2="513" stroke="#64748b" stroke-width="2"/>
<circle cx="48" cy="123" r="7" fill="#22d3ee"/>
<rect x="72" y="86" width="264" height="75" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="204.0" y="116.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">改为 debug</text>
<text x="204.0" y="137.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">脱离 RS，移出 EndpointSlice</text>
<circle cx="48" cy="227" r="7" fill="#34d399"/>
<rect x="72" y="190" width="264" height="75" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="204.0" y="220.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">约 3 秒后</text>
<text x="204.0" y="241.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">RS 补建 txbtd，共 3 个 Pod</text>
<circle cx="48" cy="331" r="7" fill="#a78bfa"/>
<rect x="72" y="294" width="264" height="75" rx="11" fill="#142238" stroke="#a78bfa" stroke-width="1.5"/>
<text x="204.0" y="324.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">改回 web-a</text>
<text x="204.0" y="345.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">被收养，RS 删掉 txbtd</text>
<circle cx="48" cy="435" r="7" fill="#fbbf24"/>
<rect x="72" y="398" width="264" height="75" rx="11" fill="#142238" stroke="#fbbf24" stroke-width="1.5"/>
<text x="204.0" y="428.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">再移出后删 Deployment</text>
<text x="204.0" y="449.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">孤儿 Pod 仍在运行占资源</text>
<text x="180" y="534.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">改回标签会删掉一个健康 Pod，调试完直接删隔离的 Pod。</text>
<line x1="24" y1="552" x2="336" y2="552" stroke="#334155"/>
<text x="24" y="571" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text>
</svg>
