<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 475" role="img" aria-labelledby="title desc">
<title id="title">放置 Pod 后如何判定 skew</title>
<desc id="desc">ScheduleAnyway 将偏差作为评分偏好。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="475" rx="16" fill="#0f172a"/>
<rect width="360" height="475" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">放置 Pod 后如何判定 skew</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">让副本分散到不同节点</text>
<rect x="24" y="87" width="312" height="83" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="180.0" y="121.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">拓扑域计数</text>
<text x="180.0" y="142.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">估算放置后的数量差</text>
<path d="M180 170 V216 H98 V254" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180 216 H262 V254" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="254" width="148" height="132" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="98.0" y="313.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">差值在 maxSkew 内</text>
<text x="98.0" y="334.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">可继续考虑该节点</text>
<rect x="188" y="254" width="148" height="132" rx="11" fill="#142238" stroke="#fb7185" stroke-width="1.5"/>
<text x="262.0" y="304.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">超出且</text>
<text x="262.0" y="322.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">DoNotSchedule</text>
<text x="262.0" y="345.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">保持 Pending</text>
<text x="180" y="424.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">ScheduleAnyway 将偏差作为评分偏好。</text>
<line x1="24" y1="442" x2="336" y2="442" stroke="#334155"/>
<text x="24" y="461" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text>
</svg>
