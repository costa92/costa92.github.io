<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">控制平面高可用入口</title><desc id="diagram-desc">负载均衡入口也需可靠部署；三成员 etcd 至少需要两个成员形成多数派。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="490" rx="16" fill="#0f172a"/><rect width="360" height="490" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">控制平面高可用入口</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">入口、API 与 etcd 多数派</text>
<rect x="24" y="80" width="312" height="60" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="106.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">固定 API 入口</text>
<text x="180.0" y="122.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">负载均衡器需高可用</text>
<path d="M180 140 V180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="180" width="312" height="64" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="180.0" y="208.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">多个控制平面</text>
<text x="180.0" y="224.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">健康的 API Server 接收请求</text>
<path d="M180 244 V278 H98 V314" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 278 H262 V314" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="314" width="148" height="100" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="98.0" y="360.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">stacked etcd</text>
<text x="98.0" y="376.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">与控制平面同节点</text>
<rect x="188" y="314" width="148" height="100" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="262.0" y="360.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">external etcd</text>
<text x="262.0" y="376.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">独立 etcd 集群</text>
<text x="180" y="445" text-anchor="middle" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">两种拓扑都需要 etcd 多数派</text>
