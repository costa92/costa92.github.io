<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 475" role="img" aria-labelledby="title desc">
<title id="title">认证中间件失效之后</title>
<desc id="desc">上线认证中间件后，用不带凭据的请求确认返回 401。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="475" rx="16" fill="#0f172a"/>
<rect width="360" height="475" rx="16" fill="url(#grid)"/>
<text x="24" y="32" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700">认证中间件失效之后</text>
<text x="24" y="54" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11">同一 Host 上有兜底路由时：认证被绕过</text>
<rect x="24" y="87" width="312" height="83" rx="11" fill="#142238" stroke="#22d3ee" stroke-width="1.5"/>
<text x="180.0" y="121.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Secret 不存在</text>
<text x="180.0" y="142.5" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">/admin 路由变为 disabled</text>
<path d="M180 170 V216 H98 V254" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M180 216 H262 V254" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="254" width="148" height="132" rx="11" fill="#142238" stroke="#34d399" stroke-width="1.5"/>
<text x="98.0" y="313.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">没有兜底路由</text>
<text x="98.0" y="334.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">返回 404，没有放行</text>
<rect x="188" y="254" width="148" height="132" rx="11" fill="#142238" stroke="#fb7185" stroke-width="1.5"/>
<text x="262.0" y="305.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f8fafc">有兜底路由</text>
<text x="262.0" y="326.8" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">落到兜底路由，200</text>
<text x="262.0" y="341.2" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" fill="#cbd5e1">绕过认证</text>
<text x="180" y="424.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" fill="#fbbf24">上线认证中间件后，用不带凭据的请求确认返回 401。</text>
<line x1="24" y1="442" x2="336" y2="442" stroke="#334155"/>
<text x="24" y="461" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text>
</svg>
