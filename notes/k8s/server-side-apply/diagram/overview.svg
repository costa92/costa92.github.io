<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 505" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Server-Side Apply 字段所有权</title><desc id="diagram-desc">在实验 ConfigMap 上使用两个字段管理者制造可控冲突，理解 managedFields 与冲突处理。</desc>
