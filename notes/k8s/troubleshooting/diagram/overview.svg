<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">常见故障排查</title><desc id="diagram-desc">外层状态码只说明请求走到了哪一层：404 查 Ingress，503 查 Endpoints，502 查端口，再往里查 Pod。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="515" rx="16" fill="#0f172a"/><rect width="360" height="515" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">常见故障排查</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">外层状态码指出请求走到哪层</text>
<rect x="40" y="84" width="296" height="58" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="188.0" y="109.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">外层状态码指出请求走到哪层</text>
<text x="188.0" y="125.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">依条件分别判断</text>
<path d="M40 114 H24 V441" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
<path d="M24 194 H32" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="164" width="296" height="62" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="188.0" y="183.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Ingress 404</text>
<text x="188.0" y="199.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">describe ingress，</text>
<text x="188.0" y="215.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">再看控制器日志</text>
<path d="M24 270 H32" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="240" width="296" height="62" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="188.0" y="259.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Ingress 503</text>
<text x="188.0" y="275.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">Service Endpoints</text>
<text x="188.0" y="291.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">为空：查选择器</text>
<path d="M24 346 H32" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="316" width="296" height="62" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="188.0" y="343.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Ingress 502</text>
<text x="188.0" y="359.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">targetPort 与容器端口不一致</text>
<path d="M24 422 H32" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="392" width="296" height="62" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="188.0" y="419.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">往里一层：Pod</text>
<text x="188.0" y="435.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">调度、拉镜像、就绪探针</text>
<line x1="24" y1="480" x2="336" y2="480" stroke="#334155"/>
<text x="24" y="500" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
