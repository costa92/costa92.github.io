<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 567" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">CSI 卷快照与恢复</title><desc id="diagram-desc">识别 VolumeSnapshot 的组件前提，用实验 PVC 创建快照并恢复到新的 PVC，区分快照与完整备份。</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 L0 0 0 32" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7Z" fill="#94a3b8"/></marker></defs>
<rect width="360" height="567" rx="16" fill="#0f172a"/><rect width="360" height="567" rx="16" fill="url(#grid)"/>
<text x="24" y="29" fill="#f8fafc" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="17" font-weight="700">CSI 卷快照与恢复</text>
<text x="24" y="51" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="11.5">快照与完整备份边界</text>
<rect x="24" y="72" width="312" height="58" rx="10" fill="#152338" stroke="#22d3ee" stroke-width="1.4"/>
<text x="180.0" y="97.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">CSI 快照前置</text>
<text x="180.0" y="113.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">驱动、CRD、快照类</text>
<path d="M180 130 V161 H98 V192" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M180 161 H262 V192" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="192" width="148" height="78" rx="10" fill="#152338" stroke="#fb7185" stroke-width="1.4"/>
<text x="98.0" y="227.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">不满足</text>
<text x="98.0" y="243.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">停止并排查组件</text>
<rect x="188" y="192" width="148" height="78" rx="10" fill="#152338" stroke="#34d399" stroke-width="1.4"/>
<text x="262.0" y="227.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">满足</text>
<text x="262.0" y="243.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">从原 PVC 建快照</text>
<path d="M262 270 V314 H180 V342" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="342" width="312" height="62" rx="10" fill="#152338" stroke="#a78bfa" stroke-width="1.4"/>
<text x="180.0" y="369.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">ReadyToUse = true</text>
<text x="180.0" y="385.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">false 时等待或排查</text>
<path d="M180 404 V446" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="24" y="446" width="312" height="62" rx="10" fill="#152338" stroke="#fbbf24" stroke-width="1.4"/>
<text x="180.0" y="473.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="14" fill="#f8fafc" font-weight="700">新 PVC</text>
<text x="180.0" y="489.0" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#cbd5e1">从快照恢复；另需独立备份</text>
<line x1="24" y1="532" x2="336" y2="532" stroke="#334155"/>
<text x="24" y="552" fill="#94a3b8" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="10">costalong.com · Kubernetes 笔记</text></svg>
