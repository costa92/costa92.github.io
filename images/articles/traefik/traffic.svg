iddleware</text><text x="180.0" y="422.0" text-anchor="middle" fill="#cbd5e1" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400">按配置修改或检查请求</text><path d="M180 433 V469" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="469" width="312" height="58" rx="12" fill="#142238" stroke="#a78bfa" stroke-width="1.7"/><text x="180.0" y="495.0" text-anchor="middle" fill="#f8fafc" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600">Service</text><text x="180.0" y="516.0" text-anchor="middle" fill="#cbd5e1" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400">转发到后端应用</text><text x="180" y="578" text-anchor="middle" fill="#94a3b8" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="400">实线：请求路径 · 虚线：配置来源</text>
